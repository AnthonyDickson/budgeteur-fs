  name: 'authelia_session'
  same_site: 'lax'
  inactivity: '5m'
  expiration: '1h'
  remember_me: '1M'
  cookies:
    # Dev: host networking — browser on host resolves 127.0.0.1
    - domain: '127.0.0.1'
      authelia_url: 'https://127.0.0.1:9091'
      name: 'authelia_session'
      same_site: 'lax'
      inactivity: '5m'
      expiration: '1h'
      remember_me: '1d'

