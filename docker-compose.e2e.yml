services:
  authelia:
    image: authelia/authelia:4.39.20
    container_name: budegeteur-fs-authelia-e2e
    network_mode: "host"
    restart: unless-stopped
    volumes:
      - ./authelia:/config
    environment:
      - TZ=UTC
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "--quiet", "-O", "/dev/null", "https://localhost:9091/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  server:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    container_name: budgeteur-fs-server-e2e
    network_mode: "host"
    working_dir: /src/server/src/Budgeteur
    stdin_open: true
    tty: true
    command: >
      sh -c "rm -f /tmp/todos_e2e.db && dotnet watch run --no-hot-reload"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Login__ReturnUrl=http://localhost:5173/
      - ConnectionStrings__Default=Data Source=/tmp/todos_e2e.db
    volumes:
      - ./.git:/src/.git:ro
      - ./server:/src/server
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/localhost/5000"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  client:
    build:
      context: .
      dockerfile: Dockerfile.client-dev
    container_name: budgeteur-fs-client-e2e
    network_mode: "host"
    working_dir: /src/client
    stdin_open: true
    tty: true
    command: >
      sh -c "npm install && npx vite --host"
    environment:
      - NODE_ENV=development
      - BACKEND_URL=http://localhost:5000
    volumes:
      - ./client:/src/client
      - client-node-modules:/src/client/node_modules
      - gleam-packages:/src/client/build
    healthcheck:
      test: ["CMD", "wget", "--quiet", "-O", "/dev/null", "http://localhost:5173"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  e2e:
    image: mcr.microsoft.com/playwright:v1.61.1-resolute
    container_name: budgeteur-fs-playwright-e2e
    network_mode: "host"
    working_dir: /tests
    command: sh -c "npm install && npx playwright test --reporter=line"
    environment:
      - BASE_URL=http://localhost:5173
      - CI=1
    volumes:
      - ./tests/e2e:/tests
      - e2e-node-modules:/tests/node_modules
    depends_on:
      authelia:
        condition: service_healthy
      server:
        condition: service_healthy
      client:
        condition: service_healthy

volumes:
  gleam-packages:
  client-node-modules:
  e2e-node-modules:
