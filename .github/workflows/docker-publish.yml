name: Build and Push Docker Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag semver (e.g., 1.2.3, 3.0.0-beta1)'
        required: true
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Tags the image with the version, plus latest unless it is a
      # pre-release, and normalises the version (v1.2.3 becomes 1.2.3).
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/anthonydickson/budgeteur-fs
          tags: type=semver,pattern={{version}},value=${{ inputs.tag }}

      # metadata-action only warns about an invalid semver and outputs no
      # version.
      - name: Check the tag is semver
        env:
          TAG: ${{ inputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if [[ -z "$VERSION" ]]; then
            echo "'$TAG' is not a valid semver version. See https://semver.org/"
            exit 1
          fi

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: budgeteur-fs:smoke
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Run the image as docker/docker-compose.prod.example.yml does (named
      # volume over /data, production environment) and wait for a healthy
      # status report carrying the requested version. The OIDC authority is
      # only contacted on login, so a placeholder suffices.
      - name: Smoke test
        id: smoke
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker run -d --name smoke -p 5000:5000 -v smoke-data:/data \
            -e Oidc__Authority=https://auth.example.invalid \
            -e Oidc__ClientId=budgeteur-fs \
            -e Oidc__ClientSecret=smoke \
            -e Oidc__CallbackPath=/signin-oidc \
            -e Login__ReturnUrl=http://localhost:5000/ \
            -e "ConnectionStrings__Default=Data Source=/data/app.sqlite3" \
            -e DataProtection__KeysPath=/data/keys \
            budgeteur-fs:smoke
          for _ in $(seq 1 30); do
            if status="$(curl -fsS http://localhost:5000/api/status)"; then
              echo "$status"
              if grep -qF "\"version\":\"$VERSION+" <<< "$status"; then
                exit 0
              fi
              echo "Expected version $VERSION"
              break
            fi
            sleep 1
          done
          docker logs smoke
          exit 1

      - if: failure() && steps.smoke.outcome == 'failure'
        run: |
          echo "The image failed its smoke test. Build it with 'docker build -f docker/Dockerfile .' and run it with a named volume over /data to reproduce."

      - name: Push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha

      - name: Create and push git tag
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          git tag "$VERSION"
          git push origin "$VERSION"
